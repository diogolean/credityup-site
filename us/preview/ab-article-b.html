<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant B article button</title>
<style>
  body { margin:0; background:#f4f5f7; font-family:system-ui,sans-serif; color:#1c1917; }
  .band { background:#d81b60; color:#fff; text-align:center; padding:22px 16px; }
  .card { max-width:640px; margin:18px auto 120px; background:#fff; border-radius:16px; padding:20px; }
  .ad { min-height:120px; background:#f3f1f4; color:#9a97a3; text-align:center; letter-spacing:.14em; font-size:10px; text-transform:uppercase; padding-top:10px; }
  a.pf { display:block; margin:10px 0; padding:14px; text-align:center; color:#fff; text-decoration:none; font-weight:800; border-radius:8px; background:#3b62f6; }
  .prompt { position:fixed; left:16px; right:16px; bottom:16px; max-width:420px; margin:0 auto; padding:16px; border:1px solid #e6e4eb; border-radius:16px; background:#fff; box-shadow:0 12px 40px rgba(16,16,20,.12); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; padding:10px; border-radius:999px; font:inherit; cursor:pointer; }
  .skip { border:1px solid #e6e4eb; background:#fff; }
  .watch { border:0; background:#16161d; color:#fff; }
</style>
</head>
<body>
<div class="band">Free vs paid on easy dating apps</div>
<main class="card">
  <div class="ad">Advertisement</div>
  <p>On a free plan you can build a profile and send a limited number of likes. Tinder Gold, Bumble Premium, and Hinge+ are the paid tiers. The price is on the store screen.</p>
  <a class="pf" href="https://us.credityup.com/best-easy-dating-apps-lp-01-art02/">READ TIPS ➔</a>
</main>
<aside class="prompt" role="dialog" aria-label="Optional advertisement">
  <p>Watch a short ad to open this guide?</p>
  <div class="row">
    <input class="skip" type="button" value="Skip">
    <input class="watch" type="button" value="Watch the ad">
  </div>
</aside>
</body>
</html>
