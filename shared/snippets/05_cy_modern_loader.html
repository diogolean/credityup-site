<style id="cy-loader-css">
#cy-loader{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.92),rgba(255,240,246,.96));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .35s ease,visibility .35s ease}
#cy-loader.cy-hide{opacity:0;visibility:hidden;pointer-events:none}
#cy-loader .cy-hearts{position:relative;width:64px;height:64px}
#cy-loader .cy-hearts span{position:absolute;inset:0;margin:auto;width:26px;height:26px;background:#e62a7a;transform:rotate(45deg);animation:cyb 1.1s ease-in-out infinite}
#cy-loader .cy-hearts span:before,#cy-loader .cy-hearts span:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:inherit}
#cy-loader .cy-hearts span:before{left:-13px}#cy-loader .cy-hearts span:after{top:-13px}
#cy-loader .cy-hearts span:nth-child(2){background:#ff7aa8;opacity:.55;animation-delay:.2s;transform:rotate(45deg) scale(1.5)}
#cy-loader .cy-bar{width:140px;height:4px;border-radius:4px;background:rgba(230,42,122,.15);overflow:hidden}
#cy-loader .cy-bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#e62a7a,#ff7aa8);animation:cyl 1s ease-in-out infinite}
@keyframes cyb{0%,100%{transform:rotate(45deg) scale(.85)}50%{transform:rotate(45deg) scale(1.05)}}
@keyframes cyl{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#cy-loader *{animation:none!important}}
</style>
<script>
(function(){
  var MIN=1500, MAX=2500, t0=Date.now(), done=false;
  function mk(){ if(document.getElementById('cy-loader')||!document.body) return;
    var d=document.createElement('div'); d.id='cy-loader'; d.setAttribute('aria-hidden','true');
    d.innerHTML='<div class="cy-hearts"><span></span><span></span></div><div class="cy-bar"><i></i></div>';
    document.body.insertBefore(d,document.body.firstChild); }
  function hide(){ if(done) return; var w=MIN-(Date.now()-t0);
    if(w>0){ setTimeout(hide,w); return; } done=true;
    var d=document.getElementById('cy-loader'); if(d){ d.classList.add('cy-hide'); setTimeout(function(){d.remove();},400);} }
  if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  // auction window: hide when first ad slot finishes rendering, or at MAX ms
  window.googletag=window.googletag||{cmd:[]};
  googletag.cmd.push(function(){ googletag.pubads().addEventListener('slotRenderEnded',function(){ hide(); }); });
  setTimeout(hide,MAX);
})();
</script>
