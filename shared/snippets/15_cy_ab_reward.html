<!--
HFCM snippet #15 "CY A/B rewarded opt-in".
Placement: Footer, Site Wide, Active. Do not replace snippets #1, #3, #4, or the loader.
Variant A is the page as it is today. Variant B adds two opt-in rewarded steps only.
The on-load RAM popup, interstitial, content1/content2, and Offerwall are not modified.
-->
<script>
(function (w, d) {
  if (w.cyAbReward) return;
  var DAY = 86400, MONTH = 30 * DAY, COOLDOWN_MS = 60000, AD_WAIT_MS = 4000;
  var KEY = 'cy_ab';

  function readStored() {
    var match = d.cookie.match(/(?:^|;\s*)cy_ab=([AB])(?:;|$)/);
    if (match) return match[1];
    try {
      var local = localStorage.getItem(KEY);
      if (local === 'A' || local === 'B') return local;
    } catch (err) {}
    return '';
  }

  function store(variant) {
    d.cookie = KEY + '=' + variant + ';path=/;max-age=' + MONTH + ';SameSite=Lax' +
      (w.location.protocol === 'https:' ? ';Secure' : '');
    try { localStorage.setItem(KEY, variant); } catch (err) {}
  }

  var variant = readStored();
  if (!variant) {
    variant = Math.random() < 0.5 ? 'A' : 'B';
    store(variant);
  }

  w.googletag = w.googletag || { cmd: [] };
  w.googletag.cmd = w.googletag.cmd || [];
  w.googletag.cmd.push(function () {
    try { w.googletag.pubads().setTargeting('cy_ab', variant); } catch (err) {}
  });

  function patchFbq(fn) {
    if (!fn || fn.__cyAb) return;
    var wrapped = function () {
      var args = Array.prototype.slice.call(arguments);
      var kind = args[0];
      if (kind === 'track' || kind === 'trackCustom') {
        var params = args[2];
        if (!params || typeof params !== 'object') {
          params = {};
          args[2] = params;
        }
        if (!params.cy_ab) params.cy_ab = variant;
      }
      return fn.apply(this, args);
    };
    wrapped.__cyAb = 1;
    ['queue', 'loaded', 'version', 'callMethod', 'push', 'getState'].forEach(function (key) {
      if (key in fn) wrapped[key] = fn[key];
    });
    w.fbq = wrapped;
  }
  patchFbq(w.fbq);
  var patches = 0;
  var patchTimer = setInterval(function () {
    patchFbq(w.fbq);
    if (++patches > 40) clearInterval(patchTimer);
  }, 250);

  function articleUrl() {
    var path = '';
    try { path = String(w.location.pathname || ''); } catch (err) { path = ''; }
    if (path.indexOf('/instant-matchmaking-apps-lp-02') !== -1) {
      return 'https://us.credityup.com/instant-matchmaking-apps-lp-02-art01/';
    }
    return 'https://us.credityup.com/best-easy-dating-apps-lp-01-art01/';
  }

  function rewardedActive() {
    var modal = d.getElementById('masterRewarded');
    if (modal && /(^|\s)active(\s|$)/.test(modal.className)) return true;
    if (d.querySelector('[data-wads-rewarded]')) return true;
    if (w.ramRewardActive) return true;
    return false;
  }

  function inCooldown() {
    var now = Date.now();
    try {
      var own = parseInt(localStorage.getItem('cy_reward_cd') || '0', 10);
      if (own && now - own < COOLDOWN_MS) return true;
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i) || '';
        if (key.indexOf('ram_reward_cd_') !== 0) continue;
        var at = parseInt(localStorage.getItem(key) || '0', 10);
        if (at && now - at < COOLDOWN_MS) return true;
      }
    } catch (err) {}
    return false;
  }

  function markCooldown() {
    try { localStorage.setItem('cy_reward_cd', String(Date.now())); } catch (err) {}
  }

  function rewardPath() {
    var nodes = d.getElementsByTagName('script');
    var re = /\/23340104016\/[^"'\\\s]+rewarded[^"'\\\s]*/;
    for (var i = 0; i < nodes.length; i++) {
      var found = re.exec(nodes[i].text || '');
      if (found) return found[0];
    }
    return '';
  }

  function go(url) {
    if (!url) return;
    w.location.assign(url);
  }

  function showRewardedThen(url) {
    if (rewardedActive() || inCooldown()) { go(url); return; }
    var path = rewardPath();
    if (!path || !w.googletag || !w.googletag.enums || !w.googletag.enums.OutOfPageFormat) {
      go(url);
      return;
    }
    var finished = false;
    function done() {
      if (finished) return;
      finished = true;
      markCooldown();
      go(url);
    }
    var timer = setTimeout(done, AD_WAIT_MS);
    w.googletag.cmd.push(function () {
      var slot;
      try {
        slot = w.googletag.defineOutOfPageSlot(path, w.googletag.enums.OutOfPageFormat.REWARDED);
      } catch (err) { slot = null; }
      if (!slot) { clearTimeout(timer); done(); return; }
      try { slot.addService(w.googletag.pubads()); } catch (err) { clearTimeout(timer); done(); return; }
      var pubs = w.googletag.pubads();
      pubs.addEventListener('rewardedSlotReady', function (event) {
        if (!event || event.slot !== slot || finished) return;
        clearTimeout(timer);
        try { event.makeRewardedVisible(); } catch (err) { done(); }
      });
      pubs.addEventListener('rewardedSlotClosed', function (event) {
        if (event && event.slot === slot) done();
      });
      pubs.addEventListener('slotRenderEnded', function (event) {
        if (event && event.slot === slot && event.isEmpty) { clearTimeout(timer); done(); }
      });
      try {
        w.googletag.enableServices();
        w.googletag.display(slot);
      } catch (err) { clearTimeout(timer); done(); }
    });
  }

  function prompt(message, onWatch, onSkip) {
    if (d.getElementById('cy-ab-prompt')) return;
    var box = d.createElement('aside');
    box.id = 'cy-ab-prompt';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', 'Optional advertisement');
    box.style.cssText = 'margin:16px;padding:16px;border:1px solid #e6e4eb;border-radius:16px;background:#fff;color:#16161d;font:15px/1.45 system-ui,sans-serif';
    var copy = d.createElement('p');
    copy.style.margin = '0 0 12px';
    copy.textContent = message;
    var row = d.createElement('div');
    row.style.cssText = 'display:flex;gap:8px';
    function control(label, primary) {
      var input = d.createElement('input');
      input.type = 'button';
      input.value = label;
      input.style.cssText = 'flex:1;padding:10px;border-radius:999px;cursor:pointer;font:inherit;' +
        (primary ? 'border:0;background:#16161d;color:#fff' : 'border:1px solid #e6e4eb;background:#fff;color:#16161d');
      return input;
    }
    var skip = control('Skip', false);
    var watch = control('Watch the ad', true);
    skip.onclick = function () { box.remove(); onSkip(); };
    watch.onclick = function () { box.remove(); onWatch(); };
    row.appendChild(skip);
    row.appendChild(watch);
    box.appendChild(copy);
    box.appendChild(row);
    return box;
  }

  function mountQuizPrompt() {
    var quiz = d.getElementById('qwu-quiz-en');
    if (!quiz || quiz.getAttribute('data-cy-ab-settled') === '1') return;
    if (quiz.getAttribute('data-qwu-phase') !== 'result') return;
    var cta = quiz.querySelector('button.quiz-option-btn[data-qwu-en-value="__cta__"]');
    if (cta) cta.style.display = 'none';
    var parent = quiz.querySelector('#qwu-en-body') || quiz;
    var box = d.getElementById('cy-ab-prompt');
    if (!box) {
      box = prompt(
        'Watch a short ad to see your recommended apps?',
        function () { quiz.setAttribute('data-cy-ab-settled', '1'); showRewardedThen(articleUrl()); },
        function () { quiz.setAttribute('data-cy-ab-settled', '1'); go(articleUrl()); }
      );
    }
    var email = d.getElementById('cy-lead');
    if (email && email.parentNode) {
      if (email.nextSibling !== box) email.parentNode.insertBefore(box, email.nextSibling);
    } else if (box.parentNode !== parent) {
      parent.appendChild(box);
    }
  }

  function armArticleLinks() {
    d.addEventListener('click', function (event) {
      var link = event.target && event.target.closest ? event.target.closest('a.pf-dbtn') : null;
      if (!link || link.getAttribute('data-cy-ab-pass') === '1') return;
      var href = link.getAttribute('href');
      if (!href) return;
      event.preventDefault();
      event.stopPropagation();
      if (rewardedActive() || inCooldown()) { go(href); return; }
      var existing = d.getElementById('cy-ab-prompt');
      if (existing) existing.remove();
      var box = prompt(
        'Watch a short ad to open this guide?',
        function () { showRewardedThen(href); },
        function () { go(href); }
      );
      box.style.cssText += ';position:fixed;left:16px;right:16px;bottom:16px;z-index:40;max-width:420px;margin:0 auto';
      d.body.appendChild(box);
    }, true);
  }

  w.cyAbReward = { variant: variant, offer: variant === 'B' };

  if (variant !== 'B') return;

  function start() {
    armArticleLinks();
    mountQuizPrompt();
    var quiz = d.getElementById('qwu-quiz-en');
    if (quiz && w.MutationObserver) {
      new MutationObserver(mountQuizPrompt).observe(quiz, {
        attributes: true,
        childList: true,
        subtree: true,
        attributeFilter: ['data-qwu-phase']
      });
    }
  }
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', start);
  else start();
})(window, document);
</script>
